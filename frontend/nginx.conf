server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    
    location /api {
        # Resolved per request through Docker's DNS: a literal proxy_pass host is
        # resolved once at startup and goes stale when the backend is recreated.
        resolver 127.0.0.11 valid=10s;
        set $backend http://user-backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
        
    location / {
        try_files $uri /index.html;
    }
}